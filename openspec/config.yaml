# rules ở đây là MAP PHẲNG GLOBAL — inject vào MỌI schema có artifact ID trùng tên. Vì vậy chỉ
# giữ key có mặt ở CẢ HAI schema (checkmate + checkmate-fix-bug): `tasks` và `test-cases`.
# Luật riêng của proposal/specs/design/security nhúng vào instruction trong
# schemas/checkmate/schema.yaml, KHÔNG thêm key vào đây (thêm sẽ bắn warning "Unknown artifact ID"
# ở schema không có artifact đó — upstream Fission-AI/OpenSpec #1322, kiểm lại mỗi lần nâng CLI).
schema: checkmate

context: |
  Ngôn ngữ artifact: tiếng Việt. Giữ nguyên tiếng Anh các heading cấu trúc của OpenSpec và từ khoá
  SHALL/MUST. Thuật ngữ kỹ thuật giữ tiếng Anh + giải thích Việt trong ngoặc ở lần đầu xuất hiện.

  CheckMate — maker–checker cho code và tài liệu, TypeScript strict + Node 22 + vitest.
  Monorepo: `apps/web` (server Express, UI dựng chuỗi HTML, cấu hình, cổng) · `packages/harness`
  (engine chấm: target → sinh probe → sandbox git-worktree 2 nhánh → máy phân loại → verdict) ·
  `packages/shared` (kiểu dùng chung). Dữ liệu: SQLite (`web-runs/`) + file JSON (`probes-lib/`,
  `.ncc-verify.json`, `config.json`, `.secrets.json`).

  ⛔ CHỖ SỐNG CỦA LUẬT (PO chốt 01/09 · 02/09):
  · Luật VẬN HÀNH của sản phẩm = code + test (hành vi) + kho khuôn / prompt / danh mục trigger / rubric
    (tri thức chấm, shipped trong sản phẩm). Sản phẩm không đọc hồ sơ xây dựng của chính nó lúc chạy;
    gói deploy không mang hồ sơ (scripts/pack-deploy.sh, lưới test/deploy-bundle.test.ts).
  · Hồ sơ XÂY DỰNG = openspec/ (requirement + scenario mà change cam kết) · docs/ · CLAUDE.md. Luật máy
    đọc của tính năng mới vẫn ở ba chỗ: hằng + validate trong engine (có test khoá) · `checkmate.yml`
    của repo đích · hồ sơ capability.
  · `specs/R*.md` (R1–R13) đã gỡ 02/09: bản gốc chỉ đọc ở `docs/archive/r-rules/`, mỗi điều có hàng trong
    `docs/r-rules-map.md`; điều `pending` backfill theo BA ĐÍCH ghi ở đầu bảng (hành vi → code + test ·
    tri thức vận hành → nạp vào sản phẩm · nguyên tắc xây dựng → CLAUDE.md), mỗi capability một change.
    Không viết luật vào docs/archive/, không sửa hàng loạt chú thích trích mã R.
  · Nguồn spec của repo đích do repo khai (`sources` trong checkmate.yml) hoặc engine tự dò và báo cáo —
    capability `spec-source`. Engine đọc hợp đồng và hồ sơ của mọi repo đích từ bản clone của repo đó.

  ⛔ CỔNG TẠM DỪNG (PO chốt 01/09): KHÔNG chờ verdict CheckMate để đi tiếp. Đủ điều kiện sang bước
  sau = code + test xanh + PO duyệt. Đừng poll prod, đừng để PR treo chờ chấm. Lý do: cổng đang
  nhiễu (hoi_quy = 0 ở 14/14 lượt; verdict FAIL đến từ finding do model viết, không từ nhãn máy).
  Bật lại CHỈ khi PO nói — không agent nào tự quyết. Vẫn giữ nguyên: máy KHÔNG BAO GIỜ tự merge
  (R6.19) và không tự merge khi PO chưa duyệt — thứ bị treo là bước chờ verdict, không phải kỷ luật
  maker–checker.

  Hợp đồng repo: `checkmate.yml` khai bảng module/hàm cho engine. Thêm/đổi export mà quên khai →
  lưới `test/hop-dong-repo.test.ts` đỏ (đã bắt hụt 5 lần trong lịch sử repo).

rules:
  tasks:
    - Task phải là checkbox `- [ ] X.Y` — pha apply đọc checkbox để theo dõi, dòng không đúng dạng sẽ không được tính
    - Proposal khai «Luật chạm tới» → PHẢI có task viết/sửa requirement ở delta spec của change (`specs/<capability>/spec.md`) kèm test khoá; luật KHÔNG viết vào docs/archive/r-rules/
    - Thêm/đổi export → PHẢI có task khai vào bảng module của `checkmate.yml` (hoặc ghi N/A kèm lý do)
  test-cases:
    - Section "Trục nhạy cảm" trong template là BẮT BUỘC — điền test hoặc đánh `[N/A]` kèm lý do, KHÔNG được xoá
    - Mỗi ca khoá lỗi phải ĐỎ trên code trước khi vá — test không đỏ trước fix là test mồ côi, không chứng minh được nó đang canh gì
    - "Suite xanh KHÔNG đủ: hỏng nguy hiểm nhất của một cổng chấm là XANH GIẢ, nên phải có ca «đường sai / actor sai / đầu vào khuyết → bị chặn»"

operations:
  apply:
    guidance:
      - Chạy `npx tsc --noEmit` và `npm test` TOÀN BỘ trước khi mở PR — không chỉ file vừa sửa
      - Verdict FAIL thì vá và push lại; cổng chấm lại tự động theo commit
  archive:
    guidance:
      - Chỉ archive sau khi PR đã merge qua cổng; nợ chấp-nhận-có-ý-thức phải được ghi lại ở nơi tra được
