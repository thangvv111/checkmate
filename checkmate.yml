# Hợp đồng repo đích với engine CheckMate: sources · runner · review · standards. Hợp đồng runner/review
# thuộc capability `target-contract` (đang backfill; mã cũ R2 tra ở docs/r-rules-map.md); khối `standards`
# (trần finding/probe, mật độ) thuộc `finding-volume-standard` — đọc ở NHÁNH GỐC qua git, không đọc đĩa.

# Nguồn engine đọc để chấm. Không khai thì engine tự dò (specs/ · spec/ · openspec/specs/ …) và ghi ra
# đã dò ở đâu.
sources:
  specs:
    - openspec/specs/**/*.md # luật máy đọc, sinh từ change — archive mới thành luật
  api_doc: README.md

# Chuẩn khối lượng — capability `finding-volume-standard`. Khai TƯỜNG MINH bằng đúng mặc định của engine:
# repo này là repo đích của chính nó, nên bốn dòng dưới vừa là cấu hình thật vừa là ví dụ sống cho đội khác.
# Khai tường minh đổi NGUỒN trên verdict từ «mặc định» sang «checkmate.yml» — giá trị y nguyên.
#
# ⛔ Đọc từ NHÁNH GỐC qua `git show <base>:checkmate.yml`, không đọc bản trên đĩa của clone: sửa ở nhánh
# pull request KHÔNG có tác dụng cho chính lượt chấm nó, kể cả khi siết chặt hơn.
# Bước hiện tại CHỈ ĐO — mật độ được tính và ghi lên verdict, KHÔNG đổi PASS/FAIL.
standards:
  finding_cap: 100 # trần finding một lượt chấm tài liệu · dải 4–1000
  probe_cap: 100 # trần probe một lượt chấm code · dải 2–100 · hiệu dụng = min(khoá này, núm của người vận hành)
  density_per_1000_words: 20 # mức mật độ dải ≤1000 từ; dải lớn hơn nhân tỉ lệ theo bảng 20 · 12 · 8
  density_floor_words: 300 # dưới sàn này không đo mật độ · dải 50–2000

runner:
  test_cmd: 'npx vitest run {files} --reporter=junit --outputFile={out}'
  framework: vitest
  probe_dir: test
  probe_ext: .probe.test.ts
  timeout_s: 3600 # dải 30–3600 · rộng có chủ đích: siết bằng núm người vận hành, không bằng mặc định
  huong_dan_probe: |
    Import thẳng từ mã nguồn, dùng đuôi .js trong đường dẫn (mã viết theo NodeNext):
      import { classifyByMachine } from '../packages/harness/src/skill-code.js';
      import { filterRuns } from '../apps/web/src/ui-history.js';
    Test chạy trong môi trường node, KHÔNG có server nào đang chạy và KHÔNG được gọi mạng.
    Đừng viết probe cần khoá model, cần GitHub token, hay cần clone repo — chúng sẽ đỏ cả hai nhánh
    và chỉ ra nhãn ngoai_pham_vi, không chứng minh được gì.
    ĐỪNG ĐOÁN module chứa hàm — import sai module là cách hỏng probe thường gặp nhất ở repo này.
    Bảng đường dẫn chính xác (đuôi .js, tính từ thư mục test/):
