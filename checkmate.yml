      ⚠ Lớp kho nằm trong THƯ MỤC CON `kho/`, không nằm thẳng dưới `src/` — đây là chỗ đã làm hỏng
        một lượt chấm thật: probe import '../apps/web/src/di-tru.js' và chết vì thiếu đúng một thư mục.
    ⚠ CHỮ KÝ HÀM LỚP KHO — ĐỪNG ĐOÁN THAM SỐ. Đo được: ba lượt chấm liên tiếp có probe chết bằng
      'Provided value cannot be bound to SQLite parameter N' ngay ở bước dựng dữ liệu, tức trước khi
      chạm tới hành vi cần kiểm — probe không chứng minh được gì và lượt chấm mất trắng.
      Các hàm này nhận MỘT OBJECT đủ trường, không nhận danh sách tham số rời:

      appendVerdictLedger(m) · appendVerdictLedgerIfNew(m) — m là VerdictLedgerEntry, BẮT BUỘC đủ mọi trường không dấu ?:
        { luc: '2026-08-30T10:00:00.000Z', run_id: 'r1', skill: 'code', artifact: 'PR #8 - code',
          sha: 'e711ced0a1', verdict: 'PASS' | 'FAIL', high: 0, medium: 0, low: 0, model: 'm' }
        Tuỳ chọn: pr (number) · tac_gia · repo · token_vao · token_ra · token_uoc (boolean) · backfill (boolean).
        Thiếu một trường bắt buộc, hoặc truyền undefined vào đó, là lỗi bind chứ không phải lỗi nghiệp vụ.
        verdict CHỈ nhận đúng 'PASS' hoặc 'FAIL' — chữ thường bị ràng buộc CHECK của bảng từ chối.

      saveMeta(m) — m là RunMeta:
        { id: 'r1', tieuDe: 'PR #8 - code', skill: 'code', trangThai: 'dang_chay' | 'xong' | 'loi',
          batDau: '2026-08-30T10:00:00.000Z' }
        Tuỳ chọn: ketThuc · repo · verdict · pr ({ so, headSha, tacGia }) · ketQuaCong.

      readVerdictLedger(loc?) · listRuns(loc?) · countRuns(loc?) — nhận object LỌC, mọi trường tuỳ chọn:
        readVerdictLedger({ repo, verdict, gioi_han, bo_qua }) · listRuns({ repo, skill, trang_thai, gioi_han, bo_qua })

      saveEvents(runId, events) — hai tham số RỜI: chuỗi id, rồi mảng sự kiện.
      appendGateLedgerEntry(entry) — sổ hành động cổng, entry: { hanhDong: 'merge' | 'reject', pr, sha, run_id, verdict, nguoi }.

      Cần dữ liệu mẫu thì chép nguyên hình dạng ở trên rồi đổi giá trị — đừng dựng object rút gọn.
    ⚠ ALIAS CỤC BỘ TRONG DIFF KHÔNG PHẢI TÊN EXPORT. Đo được: hai probe cùng chết vì gọi `docSoCaiKho`
      — tên đó chỉ là bí danh đặt lúc import trong server.ts (`import { readVerdictLedger as docSoCaiKho }`),
      hàm thật tên `readVerdictLedger`. Thấy `X as Y` trong diff thì tên phải import là X, không phải Y.
    Import TRỰC TIẾP ở đầu file. Đừng bọc import trong try/catch rồi assert typeof — làm thế thì lỗi
    import biến thành assertion thường, probe trông như đã chạy trong khi nó chưa chạy được gì.
    Hàm nào mà diff của PR mới thêm thì lấy đường dẫn từ chính diff, đừng suy từ bảng trên.
    ⚠ CHUỖI KHÓ — repo này có nhiều luật NÓI VỀ việc xử lý chuỗi, khối fence và regex, nên probe cho
    chúng rất dễ vỡ cú pháp. Đo được: hai lượt sinh liên tiếp cùng chết vì "Unterminated string".
    Luật viết chuỗi trong probe của repo này:
      - Cần ba dấu backtick thì GHÉP thay vì viết thẳng: const fence = '`' + '`' + '`';
      - Cần chuỗi có nháy hoặc dấu chéo ngược thì dùng String.raw hoặc nối từng mảnh ngắn.
      - KHÔNG lồng template literal trong template literal.
      - Mỗi chuỗi viết gọn trên MỘT dòng; đừng xuống dòng ở giữa chuỗi.
    Mỗi probe phải có ÍT NHẤT một expect() thật trên giá trị hàm trả về — file không assert gì sẽ bị
    lưới chống probe-rỗng loại và bạn mất một lượt sinh.
    Cần file tạm thì dùng mkdtempSync vào thư mục tạm của hệ, dọn trong afterAll.

review:
  # Ngoài bộ mẫu sinh-tự-động mặc định (lockfile, dist/, nhị phân) — luật diff-visibility (mã cũ R7, tra docs/r-rules-map.md)
  bo_qua_diff:
    - '^_ref/' # bản design CCS bàn giao: tài liệu tham chiếu, không phải mã của repo
    - '^bench/kq/' # kết quả benchmark, sinh ra từ lượt chạy
    - '^probes-lib(-bench)?/' # thư viện probe tích luỹ, do model sinh
  khuon_loi:
    - >-
      NHÃN MÁY SAI CHỖ: một nhánh trong bảng chân trị phân loại probe bị trả sai nhãn — nhất là
      skipped bị tính pass, hoặc thiếu đối chứng mà vẫn phong hoi_quy. Sai ở đây làm verdict sai
      mà không để lại dấu vết nào cho người đọc.
    - >-
      XANH GIẢ Ở CỔNG: một đường nào đó cho phép đi qua cổng mà chưa có bằng chứng — phản hồi rỗng
      tính là kiểm thành công, verdict cũ vẫn merge được sau khi PR có commit mới, hoặc finding
      medium được bỏ qua mà máy chủ không đối chiếu lại danh sách client gửi.
    - >-
      RÒ BÍ MẬT: token hay khoá lọt vào remote URL, vào log, vào HTML trả về, hoặc vào file cấu
      hình ghi xuống đĩa mà không che.
    - >-
      LẪN LỊCH SỬ GIỮA CÁC REPO: lượt chấm của repo này lọt vào lịch sử hay sổ cái của repo khác,
      hoặc lượt chưa gắn repo lọt vào danh sách của một repo cụ thể.
    - >-
      FAIL-SAFE NGƯỢC: đầu vào hỏng do người dùng (yml sai cú pháp, XML lạ, model trả rác) làm sập
      cả lượt chấm thay vì rơi về mặc định an toàn — và ngược lại, lỗi thật bị nuốt thành im lặng.
    - >-
      VỠ HỢP ĐỒNG VỚI REPO ĐÍCH: bỏ qua placeholder {files}/{out}, không kẹp timeout_s vào dải an
      toàn, hoặc đọc sót testcase trong testsuite lồng nhau.
  severity_map:
    high: >-
      hành vi trái điều spec khai PHẢI/KHÔNG ĐƯỢC, và nhóm chí mạng của công cụ này: verdict sai
      hoặc dán nhãn probe sai; đi qua được cổng merge/cổng kiểm mà chưa đủ bằng chứng; rò khoá,
      token hay dữ liệu giữa các repo.
    medium: >-
      lệch spec nhưng chưa làm sai verdict: thông báo lỗi gộp thành dòng chung chung khiến người
      dùng không biết sửa gì, thiếu con số cần cho việc theo dõi chi phí, hỏng an toàn không đúng
      hướng ở đường phụ.
    low: >-
      lỗi khách quan nhỏ không đổi hành vi: chú thích trỏ sai trường, tên biến lệch nghĩa, chính tả
      trong chuỗi hiển thị.
